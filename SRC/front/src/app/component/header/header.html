<header class="dashboard-header">
  <div class="header-left">
    <button 
      type="button" 
      class="btn-hamburger" 
      (click)="sidebarService.toggle()" 
      aria-label="Abrir menú de navegación" 
      title="Abrir menú de navegación">
      <i class="pi pi-bars"></i>
    </button>
    <div class="firm-logo">
      <img class="imag-padre" src="foto-padre-FOscuro.jpg" alt="Estudio Lanzilotti" />
    </div>
    <div class="firm-info">
      <span class="firm-name">ESTUDIO LANZILOTTI</span>
      <span class="firm-subtitle">{{ subtitle }}</span>
    </div>
  </div>
  <div class="header-right">
    <div class="header-stat">
      <span class="stat-value" [appCountUp]="total" [duration]="1800"></span>
      <span class="stat-label">Total</span>
    </div>
    <div class="header-stat critical">
      <span class="stat-value" [appCountUp]="criticos" [duration]="1800"></span>
      <span class="stat-label">Críticos</span>
    </div>
    <div class="header-stat risk">
      <span class="stat-value" [appCountUp]="enRiesgo" [duration]="1800"></span>
      <span class="stat-label">En riesgo</span>
    </div>
    <div class="header-stat warning">
      <span class="stat-value" [appCountUp]="advertencia" [duration]="1800"></span>
      <span class="stat-label">Advertencia</span>
    </div>
    <div class="header-stat success">
      <span class="stat-value" [appCountUp]="alDia" [duration]="1800"></span>
      <span class="stat-label">Al día</span>
    </div>
  </div>
</header>
