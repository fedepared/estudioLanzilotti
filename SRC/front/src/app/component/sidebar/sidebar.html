<!-- Backdrop -->
<div 
  class="sidebar-backdrop" 
  [class.open]="sidebarService.isOpen()" 
  (click)="close()"
  aria-hidden="true">
</div>

<!-- Drawer Panel -->
<aside class="sidebar-drawer" [class.open]="sidebarService.isOpen()" role="dialog" aria-label="Menú de navegación">
  <div class="sidebar-header">
    <div class="sidebar-brand">
      <img class="sidebar-avatar" src="foto-padre-FOscuro.jpg" alt="Logo Estudio" />
      <div class="brand-text">
        <span class="brand-title">ESTUDIO LANZILOTTI</span>
        <span class="brand-sub">Navegación</span>
      </div>
    </div>
    <button class="btn-close" (click)="close()" aria-label="Cerrar menú" title="Cerrar menú">
      <i class="pi pi-times"></i>
    </button>
  </div>

  <nav class="sidebar-nav">
    <div class="nav-section-label">Menú principal</div>

    <a 
      routerLink="/inicio" 
      routerLinkActive="active" 
      [routerLinkActiveOptions]="{ exact: true }"
      (click)="close()" 
      class="nav-item">
      <div class="nav-icon-wrapper">
        <i class="pi pi-table"></i>
      </div>
      <div class="nav-info">
        <span class="nav-title">Control general</span>
        <span class="nav-desc">Todos los procesos y estados</span>
      </div>
    </a>

    <a 
      routerLink="/escritos-rojos" 
      routerLinkActive="active" 
      (click)="close()" 
      class="nav-item critical-item">
      <div class="nav-icon-wrapper critical">
        <i class="pi pi-exclamation-triangle"></i>
      </div>
      <div class="nav-info">
        <div class="title-with-badge">
          <span class="nav-title">Escritos rojos</span>
          <span class="status-badge red">Críticos</span>
        </div>
        <span class="nav-desc">Inactividad mayor a 5 meses</span>
      </div>
    </a>
  </nav>

  <div class="sidebar-footer">
    <div class="firm-seal">
      <i class="pi pi-briefcase seal-icon"></i>
      <span class="seal-text">Estudio Lanzilotti</span>
    </div>
  </div>
</aside>
