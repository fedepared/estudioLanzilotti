<!-- Backdrop -->
<div class="sidebar-backdrop" [class.open]="sidebarService.isOpen()" (click)="close()" aria-hidden="true">
</div>

<!-- Drawer Panel -->
<aside class="sidebar-drawer" [class.open]="sidebarService.isOpen()" role="dialog" aria-label="Menú de navegación">
  <div class="sidebar-header">
    <div class="sidebar-brand">
      <img class="sidebar-avatar" src="foto-padre-FOscuro.jpg" alt="Logo Estudio" />
      <div class="brand-text">
        <span class="brand-title">ESTUDIO LANZILOTTI</span>
        <span class="brand-sub">Navegación</span>
      </div>
    </div>
    <button class="btn-close" (click)="close()" aria-label="Cerrar menú" title="Cerrar menú">
      <i class="pi pi-times"></i>
    </button>
  </div>

  <nav class="sidebar-nav">
    <div class="nav-section-label">Menú principal</div>

    <a routerLink="/inicio" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="close()"
      class="nav-item">
      <div class="nav-icon-wrapper">
        <i class="pi pi-table"></i>
      </div>
      <div class="nav-info">
        <span class="nav-title">Escritos Vencidos</span>
        <span class="nav-desc">Control de escritos vencidos</span>
      </div>
    </a>

    <a routerLink="/escritos-rojos" routerLinkActive="active" (click)="close()" class="nav-item">
      <div class="nav-icon-wrapper">
        <i class="pi pi-bookmark"></i>
      </div>
      <div class="nav-info">
        <span class="nav-title">Escritos Rojos</span>
        <span class="nav-desc">Control de escritos rojos</span>
      </div>
    </a>
  </nav>

  <div class="sidebar-footer">
    <div class="firm-seal">
      <i class="pi pi-briefcase seal-icon"></i>
      <span class="seal-text">Estudio Lanzilotti</span>
    </div>
  </div>
</aside>
